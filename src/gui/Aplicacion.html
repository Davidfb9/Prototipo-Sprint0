<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Última medida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }

    .pantalla {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .titulo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin: 0 0 12px 0;
    }

    .valor {
      font-size: 90px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      color: #0f172a;
    }

    .unidad {
      font-size: 22px;
      font-weight: 600;
      color: #475569;
      margin: 8px 0 0 0;
    }

    .detalle {
      margin-top: 28px;
      font-size: 14px;
      color: #64748b;
      line-height: 1.8;
    }

    .detalle b {
      color: #0f172a;
    }

    .estado {
      font-size: 22px;
      color: #475569;
    }

    .aviso {
      font-size: 22px;
      color: #b91c1c;
      max-width: 420px;
    }

    .pie {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      padding: 12px;
    }
  </style>
</head>

<body>

  <!-- ----------------------------------------------------------- -->
  <!-- PANTALLA: sólo presenta la medida, no decide nada           -->
  <!-- ----------------------------------------------------------- -->
  <div class="pantalla">

    <p class="titulo">Última medida recibida</p>

    <p class="estado" id="zonaValor">Consultando&hellip;</p>

    <p class="detalle" id="zonaDetalle"></p>

  </div>

  <p class="pie">Sprint 0 &middot; PBTIO 3A &middot; David Ferra</p>

  <!-- ----------------------------------------------------------- -->
  <!-- Lógica fake del navegador: la única que habla con el REST   -->
  <!-- ----------------------------------------------------------- -->
  <script src="../frontend_business_logic/consultarUltimaMedida.js"></script>

  <!-- ----------------------------------------------------------- -->
  <!-- Esta parte sólo pinta lo que le dice la lógica fake         -->
  <!-- ----------------------------------------------------------- -->
  <script>

    // ------------------------------------------------------------
    // --> refrescar() --> void
    //
    // Pide la última medida y la pinta.
    //
    // ------------------------------------------------------------
    function refrescar() {

      consultarUltimaMedida( function( error, medida ) {

        var zonaValor = document.getElementById( "zonaValor" );
        var zonaDetalle = document.getElementById( "zonaDetalle" );

        // ---------------------------------------------------------
        // caso 1: no hay medida o ha fallado algo
        // ---------------------------------------------------------
        if ( error ) {

          zonaValor.className = "aviso";
          zonaValor.textContent = error;
          zonaDetalle.textContent = "";

          return;
        }

        // ---------------------------------------------------------
        // caso 2: hay una medida
        // ---------------------------------------------------------
        var unidad = ( medida.sensor === "CO2" ) ? "ppm" : "&deg;C";

        zonaValor.className = "valor";
        zonaValor.innerHTML = medida.valor + " <span class='unidad'>" + unidad + "</span>";

        zonaDetalle.innerHTML =
          "Sensor: <b>" + medida.sensor + "</b><br>" +
          "Contador de env&iacute;o: <b>" + medida.contador + "</b><br>" +
          "Recibida: <b>" + medida.fecha + "</b>";

      } );

    }

    // ------------------------------------------------------------
    // la página se refresca sola cada 3 segundos
    // ------------------------------------------------------------
    refrescar();
    setInterval( refrescar, 3000 );

  </script>

</body>

</html>
